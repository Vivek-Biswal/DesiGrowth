<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ads Manager | DesiGrowth</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 transition-opacity duration-300 opacity-0"
      onload="document.body.classList.remove('opacity-0')">

<div class="max-w-3xl mx-auto p-6">

  <!-- Header -->
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold">📢 Ads Manager</h1>
    <a href="/frontend/pages/dashboard.html"
       class="text-gray-500 text-sm">← Back</a>
  </div>

  <!-- Form -->
  <div class="bg-white p-6 rounded-xl shadow space-y-4">

    <!-- Campaign Select -->
    <select id="campaignSelect" class="w-full border p-3 rounded-lg">
      <option value="">Select Campaign</option>
    </select>

    <!-- Platform -->
    <select id="platform" class="w-full border p-3 rounded-lg">
      <option value="Google Ads">Google Ads</option>
      <option value="Meta Ads">Meta Ads (Facebook/Instagram)</option>
    </select>

    <!-- Budget -->
    <input id="budget" type="number" placeholder="Budget (₹)"
      class="w-full border p-3 rounded-lg">

    <!-- Audience -->
    <input id="audience" placeholder="Target Audience (e.g. Age 18-35, Delhi)"
      class="w-full border p-3 rounded-lg">

    <!-- Button -->
    <button onclick="launchAd()"
      class="w-full bg-orange-500 text-white py-3 rounded-lg font-semibold">
      Launch Ad 🚀
    </button>

    <p id="status" class="text-green-600 hidden"></p>

  </div>

</div>

<!-- ✅ FIXED PATHS -->
<script src="/frontend/scripts/auth.js"></script>
<script src="/frontend/scripts/api.js"></script>

<script>
requireAuth();

let campaigns = [];

async function loadCampaigns() {
  const res = await api.getCampaigns();
  campaigns = res.campaigns;

  const select = document.getElementById("campaignSelect");

  if (!campaigns.length) {
    select.innerHTML = `<option>No campaigns available</option>`;
    return;
  }

  campaigns.forEach(c => {
    const option = document.createElement("option");
    option.value = c.id;
    option.textContent = c.product + " - " + c.offer;
    select.appendChild(option);
  });
}

function launchAd() {
  const campaignId = document.getElementById("campaignSelect").value;
  const platform = document.getElementById("platform").value;
  const budget = document.getElementById("budget").value;
  const audience = document.getElementById("audience").value;

  if (!campaignId || !budget) {
    alert("Please select campaign and enter budget");
    return;
  }

  const adData = {
    campaignId,
    platform,
    budget,
    audience,
    status: "Active",
    launched_at: new Date().toISOString()
  };

  // Save locally (demo purpose)
  let ads = JSON.parse(localStorage.getItem("ads") || "[]");
  ads.push(adData);
  localStorage.setItem("ads", JSON.stringify(ads));

  const status = document.getElementById("status");
  status.textContent = "✅ Ad launched successfully!";
  status.classList.remove("hidden");
}

loadCampaigns();
</script>

</body>
</html>
