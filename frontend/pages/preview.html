<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Campaign Preview | DesiGrowth</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-[#f8fafc] antialiased">

  <div id="mobileNav"></div>
  <div id="sidebar"></div>

  <main class="lg:pl-64 min-h-screen pt-14 pb-24 lg:pt-0 lg:pb-0">
    <div class="max-w-5xl mx-auto p-6 lg:p-8">

      <!-- Page Header -->
      <div class="flex items-center justify-between mb-8">
        <div>
          <h1 class="text-2xl font-bold text-gray-900">Campaign Preview</h1>
          <p class="text-sm text-gray-500 mt-1">Review your AI-generated campaign before saving</p>
        </div>
        <a href="/pages/builder.html"
          class="inline-flex items-center gap-1.5 text-sm text-gray-500 hover:text-gray-700
                 px-3 py-2 rounded-xl hover:bg-gray-100 transition-all duration-150">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
          </svg>
          Back
        </a>
      </div>

      <div id="previewContent"></div>

    </div>
  </main>

<script src="../scripts/api.js"></script>
<script src="../scripts/auth.js"></script>
<script src="../scripts/app.js"></script>
  <script>
    requireAuth();
    renderSidebar('builder'); // preview is part of the builder flow

    let data = null;

    try {
      data = JSON.parse(localStorage.getItem('latest_campaign'));
    } catch (e) {
      data = null;
    }
    const container = document.getElementById('previewContent');

    if (!data) {
      container.innerHTML = `
        <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-14 text-center">
          <div class="w-16 h-16 bg-gray-50 rounded-2xl flex items-center justify-center mx-auto mb-4">
            <svg class="w-8 h-8 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
            </svg>
          </div>
          <h3 class="font-semibold text-gray-900 mb-1">No campaign found</h3>
          <p class="text-sm text-gray-500 mb-6">Create a campaign first to preview it here.</p>
          <a href="/pages/builder.html"
            class="inline-flex items-center gap-2 bg-orange-500 hover:bg-orange-600 text-white
                   text-sm font-semibold px-5 py-2.5 rounded-xl transition">
            Create Campaign
          </a>
        </div>`;
    } else {
      // Normalize hashtags
      const rawTags = Array.isArray(data.hashtags)
        ? data.hashtags
        : (data.hashtags || '').split(/\s+/).filter(Boolean);
      const tagsHtml = rawTags.map(t =>
        `<span class="text-sm bg-blue-50 text-blue-600 px-2.5 py-0.5 rounded-full border border-blue-100">${t}</span>`
      ).join('');

      const businessInitial = (data.business || data.product || 'D').charAt(0).toUpperCase();

      container.innerHTML = `
        <div class="grid lg:grid-cols-5 gap-6">

          <!-- ── Post Preview (3/5) ── -->
          <div class="lg:col-span-3">
            <div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">

              <!-- Post header -->
              <div class="flex items-center gap-3 p-4 border-b border-gray-50">
                <div class="w-10 h-10 bg-gradient-to-br from-orange-400 to-orange-600 rounded-full
                            flex items-center justify-center font-bold text-white text-sm shrink-0">
                  ${businessInitial}
                </div>
                <div>
                  <p class="text-sm font-semibold text-gray-900">${data.business || 'Your Business'}</p>
                  <p class="text-xs text-gray-400">Sponsored · Just now</p>
                </div>
                <span class="ml-auto text-xs bg-green-50 text-green-600 font-medium
                             px-2 py-0.5 rounded-full border border-green-100">
                  Ready to post
                </span>
              </div>

              <!-- Poster or gradient banner -->
              ${data.poster_url
                ? `<img src="${API_BASE}${data.poster_url}">`
                : `<div class="bg-gradient-to-br from-orange-500 via-orange-400 to-amber-400 p-8 text-white">
                    <p class="text-sm font-medium text-orange-100 mb-1">${data.business || ''}</p>
                    <h2 class="text-2xl font-extrabold leading-tight mb-2">${data.product}</h2>
                    <div class="inline-flex items-center bg-white/20 backdrop-blur-sm rounded-2xl px-5 py-2.5 mt-1">
                      <span class="text-2xl font-black">${data.offer}</span>
                    </div>
                    ${data.festival ? `<p class="text-sm text-orange-100 mt-4">🎉 ${data.festival} Special</p>` : ''}
                   </div>`
              }

              <!-- Caption & tags -->
              <div class="p-5">
                <p class="text-sm text-gray-700 leading-relaxed mb-4">${data.caption || ''}</p>
                <div class="flex flex-wrap gap-1.5">${tagsHtml}</div>
              </div>
            </div>
          </div>

          <!-- ── Actions Panel (2/5) ── -->
          <div class="lg:col-span-2 space-y-4">

            <!-- Details card -->
            <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5">
              <h3 class="font-semibold text-gray-900 mb-4">Campaign Details</h3>
              <dl class="space-y-3">
                <div class="flex justify-between items-start">
                  <dt class="text-sm text-gray-500">Product</dt>
                  <dd class="text-sm font-medium text-gray-900 text-right max-w-[60%]">${data.product}</dd>
                </div>
                <div class="flex justify-between items-start">
                  <dt class="text-sm text-gray-500">Offer</dt>
                  <dd class="text-sm font-semibold text-orange-600">${data.offer}</dd>
                </div>
                ${data.festival ? `
                <div class="flex justify-between items-start">
                  <dt class="text-sm text-gray-500">Festival</dt>
                  <dd class="text-sm font-medium text-gray-900">${data.festival}</dd>
                </div>` : ''}
                ${data.location ? `
                <div class="flex justify-between items-start">
                  <dt class="text-sm text-gray-500">Location</dt>
                  <dd class="text-sm font-medium text-gray-900">${data.location}</dd>
                </div>` : ''}
                <div class="flex justify-between items-center pt-3 border-t border-gray-50">
                  <dt class="text-sm text-gray-500">Status</dt>
                  <dd>${statusBadge(data.status || 'generated')}</dd>
                </div>
              </dl>
            </div>

            <!-- Action buttons -->
            <div class="space-y-2.5">
              <button onclick="copyCaption()"
                class="w-full flex items-center justify-center gap-2 bg-white border border-gray-200
                       hover:bg-gray-50 text-gray-700 font-medium text-sm py-3 rounded-xl
                       transition-all duration-200">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                </svg>
                Copy Caption &amp; Hashtags
              </button>

              <button onclick="editCampaign()"
                class="w-full flex items-center justify-center gap-2 bg-white border border-gray-200
                       hover:bg-gray-50 text-gray-700 font-medium text-sm py-3 rounded-xl
                       transition-all duration-200">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                </svg>
                Edit Campaign
              </button>

              <button onclick="goToDashboard()"
                class="w-full flex items-center justify-center gap-2 bg-orange-500 hover:bg-orange-600
                       text-white font-semibold text-sm py-3.5 rounded-xl transition-all duration-200
                       shadow-sm hover:shadow-md shadow-orange-200">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
                </svg>
                Save &amp; Go to Dashboard
              </button>
            </div>

            <!-- Promote shortcut -->
            <div class="bg-orange-50 border border-orange-100 rounded-2xl p-4">
              <p class="text-sm font-semibold text-orange-800 mb-1">Launch as Paid Ad</p>
              <p class="text-xs text-orange-600 mb-3">Promote this campaign on Google or Meta Ads</p>
              <a href="/frontend/pages/ads.html"
                class="inline-flex items-center gap-1.5 text-xs font-semibold text-orange-600
                       hover:text-orange-700 transition-colors">
                Go to Ads Manager
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 7l5 5m0 0l-5 5m5-5H6"/>
                </svg>
              </a>
            </div>

          </div>
        </div>`;
    }

    function copyCaption() {
      if (!data) return;
      const rawTags = Array.isArray(data.hashtags)
        ? data.hashtags.join(' ')
        : (data.hashtags || '');
      const text = (data.caption || '') + '\n\n' + rawTags;
      navigator.clipboard.writeText(text.trim())
        .then(() => showToast('Caption & hashtags copied!', 'success'))
        .catch(() => showToast('Could not copy — please copy manually', 'error'));
    }

    function goToDashboard() {
      window.location.href = '/pages/dashboard.html';
    }

    function editCampaign() {
      window.location.href = '/frontend/pages/builder.html';
    }
  </script>


</body>
</html>
