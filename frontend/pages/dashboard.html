<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard | DesiGrowth</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-[#f8fafc] antialiased">

  <div id="mobileNav"></div>
  <div id="sidebar"></div>

  <main class="lg:pl-64 min-h-screen pt-14 pb-24 lg:pt-0 lg:pb-0">
    <div class="max-w-6xl mx-auto p-6 lg:p-8">

      <!-- Page Header -->
      <div class="flex items-center justify-between mb-8">
        <div>
          <h1 id="greeting" class="text-2xl font-bold text-gray-900">Dashboard</h1>
          <p class="text-sm text-gray-500 mt-1">Here's what's happening with your campaigns</p>
        </div>
        <a href="/pages/builder.html"
          class="hidden md:inline-flex items-center gap-2 bg-orange-500 hover:bg-orange-600
                 text-white font-semibold text-sm px-4 py-2.5 rounded-xl
                 transition-all duration-200 shadow-sm hover:shadow-md shadow-orange-200">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/>
          </svg>
          New Campaign
        </a>
      </div>

      <!-- Stats Row -->
      <div class="grid grid-cols-2 lg:grid-cols-3 gap-4 mb-8">

        <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5">
          <div class="flex items-start justify-between mb-3">
            <p class="text-sm text-gray-500">Campaigns</p>
            <div class="w-9 h-9 bg-orange-50 rounded-xl flex items-center justify-center">
              <svg class="w-4 h-4 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
              </svg>
            </div>
          </div>
          <p id="statCampaigns" class="text-3xl font-bold text-gray-900">—</p>
          <p class="text-xs text-gray-400 mt-1">Total created</p>
        </div>

        <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5">
          <div class="flex items-start justify-between mb-3">
            <p class="text-sm text-gray-500">Active Ads</p>
            <div class="w-9 h-9 bg-green-50 rounded-xl flex items-center justify-center">
              <svg class="w-4 h-4 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z"/>
              </svg>
            </div>
          </div>
          <p id="statAds" class="text-3xl font-bold text-gray-900">—</p>
          <p class="text-xs text-gray-400 mt-1">Running now</p>
        </div>

        <div class="hidden lg:block bg-white rounded-2xl border border-gray-100 shadow-sm p-5">
          <div class="flex items-start justify-between mb-3">
            <p class="text-sm text-gray-500">Account</p>
            <div class="w-9 h-9 bg-blue-50 rounded-xl flex items-center justify-center">
              <svg class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/>
              </svg>
            </div>
          </div>
          <p class="text-3xl font-bold text-gray-900">Free</p>
          <p class="text-xs text-gray-400 mt-1">Current plan</p>
        </div>

      </div>

      <!-- Campaigns -->
      <div class="flex items-center justify-between mb-5">
        <h2 class="font-semibold text-gray-900">Your Campaigns</h2>
        <a href="/pages/builder.html"
          class="text-xs text-orange-500 hover:text-orange-600 font-medium transition-colors">
          View Analytics →
        </a>
      </div>

      <div id="campaignContainer" class="grid md:grid-cols-2 gap-5"></div>

    </div>
  </main>

<script src="../scripts/api.js"></script>
<script src="../scripts/auth.js"></script>
<script src="../scripts/app.js"></script>

<script>
requireAuth();
renderSidebar('dashboard');

// ===============================
// GREETING
// ===============================
const hour = new Date().getHours();
const greetWord =
  hour < 12 ? "Good morning" :
  hour < 18 ? "Good afternoon" :
  "Good evening";

const user = JSON.parse(localStorage.getItem("user") || "{}");
const firstName = user?.name?.split(" ")[0] || "User";

document.getElementById("greeting").textContent =
  `${greetWord}, ${firstName} 👋`;

// ===============================
// STATS INIT
// ===============================
document.getElementById("statAds").textContent =
  JSON.parse(localStorage.getItem("ads") || "[]").length;

// ===============================
// LOAD DASHBOARD
// ===============================
async function loadDashboard() {
  try {
    const res = await api.getCampaigns();

    const campaigns = Array.isArray(res.data)
      ? res.data
      : (res.data?.campaigns || []);

    document.getElementById("statCampaigns").textContent =
      campaigns.length;

    const container = document.getElementById("campaignContainer");
    container.innerHTML = "";

    // ===============================
    // EMPTY STATE
    // ===============================
    if (!campaigns.length) {
      container.innerHTML = `
        <div class="col-span-2">
          <div class="bg-white rounded-2xl border-2 border-dashed border-gray-200 p-14 text-center">
            <h3 class="font-semibold text-gray-900 mb-1">No campaigns yet</h3>
            <p class="text-sm text-gray-500 mb-6">
              Create your first AI-powered campaign in under a minute.
            </p>
            <a href="/pages/builder.html"
              class="bg-orange-500 text-white px-5 py-2 rounded-xl">
              Create Campaign →
            </a>
          </div>
        </div>`;
      return;
    }

    // ===============================
    // CAMPAIGN LIST
    // ===============================
    campaigns.forEach(c => {

      const tags = (c.hashtags || "")
        .split(" ")
        .slice(0, 4)
        .map(t => `<span class="text-xs bg-gray-100 px-2 py-1 rounded">${t}</span>`)
        .join("");

      container.innerHTML += `
        <div class="bg-white rounded-xl p-4 shadow-sm">

          <h3 class="font-bold">${c.product || "Campaign"}</h3>
          <p class="text-sm text-gray-500">${c.business || ""}</p>

          <p class="text-xs mt-2">${c.caption || ""}</p>

          <div class="flex gap-2 mt-2">${tags}</div>

          <div class="flex gap-2 mt-4">

            <button onclick="runAd('${c._id}', 'whatsapp')"
              class="flex-1 bg-green-500 text-white py-2 rounded">
              WhatsApp
            </button>

            <button onclick="runAd('${c._id}', 'meta')"
              class="flex-1 bg-blue-500 text-white py-2 rounded">
              Meta
            </button>

            <button onclick="runAd('${c._id}', 'google')"
              class="flex-1 bg-yellow-500 text-white py-2 rounded">
              Google
            </button>

          </div>

        </div>
      `;
    });

  } catch (err) {
    console.error("Dashboard error:", err);
  }
}

// ===============================
// RUN ADS (FIXED)
// ===============================
async function runAd(campaignId, platform) {
  try {
    const res = await api.publishAd({
      campaign_id: campaignId,
      platforms: [platform]   // ✅ FIXED (array)
    });

    const ad = res?.data?.ads?.[0];

    if (!ad) return;

    if (ad.platform === "whatsapp") {
      window.open(ad.external_ad_id, "_blank");
    } else {
      alert(`✅ Ad running on ${ad.platform}`);
    }

  } catch (err) {
    alert(err.message);
  }
}

// ===============================
// INIT
// ===============================
loadDashboard();
</script>

</body>
</html>
