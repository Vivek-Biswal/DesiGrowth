<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile | DesiGrowth</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 transition-opacity duration-300 opacity-0"
      onload="document.body.classList.remove('opacity-0')">

<div class="max-w-5xl mx-auto p-6">

  <!-- Header -->
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold">👤 Profile</h1>
    <button onclick="logout()"
      class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg text-sm">
      Logout
    </button>
  </div>

  <!-- User Info Card -->
  <div class="bg-white p-6 rounded-xl shadow mb-6">
    <div class="flex items-center gap-4">
      <div class="w-14 h-14 bg-orange-100 rounded-full flex items-center justify-center text-xl font-bold text-orange-600">
        <span id="initial">U</span>
      </div>
      <div>
        <h2 id="name" class="text-xl font-semibold"></h2>
        <p id="email" class="text-gray-500 text-sm"></p>
        <p id="created" class="text-gray-400 text-xs mt-1"></p>
      </div>
    </div>
  </div>

  <!-- Stats -->
  <div class="grid md:grid-cols-3 gap-6 mb-6">

    <div class="bg-white p-5 rounded-xl shadow">
      <p class="text-gray-500 text-sm">Total Campaigns</p>
      <h2 id="count" class="text-2xl font-bold">0</h2>
    </div>

    <div class="bg-white p-5 rounded-xl shadow">
      <p class="text-gray-500 text-sm">Active Ads</p>
      <h2 id="adsCount" class="text-2xl font-bold">0</h2>
    </div>

    <div class="bg-white p-5 rounded-xl shadow">
      <p class="text-gray-500 text-sm">Account Type</p>
      <h2 class="text-2xl font-bold text-green-600">Free</h2>
    </div>

  </div>

  <!-- Campaign List -->
  <div class="bg-white p-6 rounded-xl shadow">
    <h2 class="font-bold mb-4">📦 Your Campaigns</h2>

    <div id="campaignList" class="space-y-3"></div>
  </div>

</div>

<script src="../scripts/auth.js"></script>
<script src="../scripts/api.js"></script>

<script>
requireAuth();

async function loadProfile() {
  try {
    // ── User Info ──
    const userRes = await api.getUser();
    const user = userRes.user;

    document.getElementById("name").textContent = user.name;
    document.getElementById("email").textContent = user.email;
    document.getElementById("created").textContent = "Joined: " + new Date(user.created_at).toLocaleDateString();

    document.getElementById("initial").textContent =
      (user.name || "U").charAt(0).toUpperCase();

    // ── Campaigns ──
    const campaignRes = await api.getCampaigns();
    const campaigns = campaignRes.campaigns;

    document.getElementById("count").textContent = campaigns.length;

    const list = document.getElementById("campaignList");
    list.innerHTML = "";

    if (!campaigns.length) {
      list.innerHTML = `
        <div class="text-center text-gray-500">
          No campaigns yet 🚀 <br>
          <a href="./builder.html" class="text-orange-500 font-semibold">
            Create your first campaign
          </a>
        </div>
      `;
      return;
    }

    campaigns.forEach(c => {
      list.innerHTML += `
        <div class="flex justify-between items-center border-b pb-2">

          <div>
            <p class="font-medium">${c.product}</p>
            <p class="text-xs text-gray-400">${c.offer}</p>
          </div>

          <div class="text-right">
            <p class="text-xs text-gray-400">${new Date(c.created_at).toLocaleDateString()}</p>
          </div>

        </div>
      `;
    });

    // ── Ads Count (localStorage demo) ──
    const ads = JSON.parse(localStorage.getItem("ads") || "[]");
    document.getElementById("adsCount").textContent = ads.length;

  } catch (err) {
    console.error(err);
  }
}

loadProfile();
</script>

</body>
</html>
