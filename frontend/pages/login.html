<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | DesiGrowth</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 flex items-center justify-center min-h-screen">

<div class="bg-white p-8 rounded-xl shadow w-full max-w-md">

  <h1 class="text-2xl font-bold mb-6 text-center">🔐 Login</h1>

  <!-- Form -->
  <form id="loginForm" class="space-y-4">

    <input id="email" type="email" placeholder="Email"
      class="w-full border p-3 rounded-lg" required>

    <input id="password" type="password" placeholder="Password"
      class="w-full border p-3 rounded-lg" required>

    <p id="error" class="text-red-500 text-sm hidden"></p>

    <button type="submit"
      class="w-full bg-orange-500 text-white py-3 rounded-lg font-semibold">
      Login
    </button>

  </form>

  <!-- Signup -->
  <p class="text-center text-sm text-gray-500 mt-4">
    Don't have an account?
    <button onclick="signup()" class="text-orange-500 font-semibold">
      Sign up
    </button>
  </p>

</div>

<!-- ✅ FIXED PATHS -->
<script src="/frontend/scripts/auth.js"></script>
<script src="/frontend/scripts/api.js"></script>

<script>
// Already logged in → go dashboard
if (getToken()) {
  window.location.href = "/frontend/pages/dashboard.html";
}

// Login
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const errorEl = document.getElementById("error");
  errorEl.classList.add("hidden");

  try {
    const res = await api.login(
      document.getElementById("email").value,
      document.getElementById("password").value
    );

    setAuth(res.token, res.user);

    // ✅ redirect
    window.location.href = "/frontend/pages/dashboard.html";

  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.classList.remove("hidden");
  }
});

// Simple signup (quick hackathon version)
async function signup() {
  const name = prompt("Enter your name");
  const email = prompt("Enter email");
  const password = prompt("Enter password");

  if (!name || !email || !password) return;

  try {
    const res = await api.signup(name, email, password);
    setAuth(res.token, res.user);
    window.location.href = "/frontend/pages/dashboard.html";
  } catch (err) {
    alert(err.message);
  }
}
</script>

</body>
</html>
