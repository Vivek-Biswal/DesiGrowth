<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Analytics | DesiGrowth</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-[#f8fafc] antialiased">

  <div id="mobileNav"></div>
  <div id="sidebar"></div>

  <main class="lg:pl-64 min-h-screen pt-14 pb-24 lg:pt-0 lg:pb-0">
    <div class="max-w-6xl mx-auto p-6 lg:p-8">

      <!-- Page Header -->
      <div class="mb-8">
        <h1 class="text-2xl font-bold text-gray-900">Analytics</h1>
        <p class="text-sm text-gray-500 mt-1">Performance overview across all your campaigns</p>
      </div>

      <!-- KPI Cards -->
      <div class="grid grid-cols-2 lg:grid-cols-3 gap-4 mb-8">

        <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5">
          <div class="flex items-start justify-between mb-3">
            <p class="text-sm text-gray-500">Total Views</p>
            <div class="w-8 h-8 bg-blue-50 rounded-xl flex items-center justify-center">
              <svg class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
            </div>
          </div>
          <p id="views" class="text-3xl font-bold text-gray-900">—</p>
          <div class="flex items-center gap-1 mt-1.5">
            <svg class="w-3 h-3 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 15l7-7 7 7"/>
            </svg>
            <p class="text-xs text-green-500 font-medium">+12% this week</p>
          </div>
        </div>

        <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5">
          <div class="flex items-start justify-between mb-3">
            <p class="text-sm text-gray-500">Total Clicks</p>
            <div class="w-8 h-8 bg-orange-50 rounded-xl flex items-center justify-center">
              <svg class="w-4 h-4 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5"/>
              </svg>
            </div>
          </div>
          <p id="clicks" class="text-3xl font-bold text-gray-900">—</p>
          <div class="flex items-center gap-1 mt-1.5">
            <svg class="w-3 h-3 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 15l7-7 7 7"/>
            </svg>
            <p class="text-xs text-green-500 font-medium">+8% this week</p>
          </div>
        </div>

        <div class="col-span-2 lg:col-span-1 bg-white rounded-2xl border border-gray-100 shadow-sm p-5">
          <div class="flex items-start justify-between mb-3">
            <p class="text-sm text-gray-500">Engagement Rate</p>
            <div class="w-8 h-8 bg-green-50 rounded-xl flex items-center justify-center">
              <svg class="w-4 h-4 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
              </svg>
            </div>
          </div>
          <p id="engagement" class="text-3xl font-bold text-gray-900">—</p>
          <div class="flex items-center gap-1 mt-1.5">
            <svg class="w-3 h-3 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 15l7-7 7 7"/>
            </svg>
            <p class="text-xs text-green-500 font-medium">Good engagement</p>
          </div>
        </div>

      </div>

      <!-- Campaign Performance Chart -->
      <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6">
        <div class="flex items-center justify-between mb-6">
          <h2 class="font-semibold text-gray-900">Campaign Performance</h2>
          <div class="flex items-center gap-4">
            <span class="flex items-center gap-1.5 text-xs text-gray-500">
              <span class="w-2.5 h-2.5 bg-orange-400 rounded-full"></span>Views
            </span>
            <span class="flex items-center gap-1.5 text-xs text-gray-500">
              <span class="w-2.5 h-2.5 bg-blue-400 rounded-full"></span>Clicks
            </span>
          </div>
        </div>
        <div id="campaignTable"></div>
      </div>

    </div>
  </main>

<script src="../scripts/api.js"></script>
<script src="../scripts/auth.js"></script>
<script src="../scripts/app.js"></script>

  <script>
    requireAuth();
    renderSidebar('analytics');

    async function loadAnalytics() {
      const res = await api.getCampaigns();
      const campaigns = res.campaigns;
      const table = document.getElementById('campaignTable');
      table.innerHTML = '';

      if (!campaigns.length) {
        table.innerHTML = `
          <div class="text-center py-12">
            <div class="w-12 h-12 bg-gray-50 rounded-2xl flex items-center justify-center mx-auto mb-3">
              <svg class="w-6 h-6 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10"/>
              </svg>
            </div>
            <p class="text-sm text-gray-400 mb-3">No campaign data yet</p>
            <a href="/frontend/pages/builder.html"
              class="text-sm text-orange-500 hover:text-orange-600 font-medium transition-colors">
              Create your first campaign →
            </a>
          </div>`;
        return;
      }

      let totalViews = 0;
      let totalClicks = 0;

      // Deterministic metrics (seed-based, stable across reloads)
      const metrics = campaigns.map((c, i) => {
        const idStr  = String(c.id || i);
        const seed   = idStr.charCodeAt(0) + i * 17;
        const views  = 200 + (seed * 137) % 800;
        const clicks = Math.floor(views * (0.15 + (seed % 10) * 0.01));
        totalViews  += views;
        totalClicks += clicks;
        return { views, clicks };
      });

      const maxViews = Math.max(...metrics.map(m => m.views), 1);

      document.getElementById('views').textContent      = totalViews.toLocaleString('en-IN');
      document.getElementById('clicks').textContent     = totalClicks.toLocaleString('en-IN');
      document.getElementById('engagement').textContent = totalViews
        ? ((totalClicks / totalViews) * 100).toFixed(1) + '%'
        : '0%';

      campaigns.forEach((c, i) => {
        const { views, clicks } = metrics[i];
        const viewsPct  = Math.round((views  / maxViews) * 100);
        const clicksPct = Math.round((clicks / maxViews) * 100);
        const isLast    = i === campaigns.length - 1;

        table.innerHTML += `
          <div class="py-4 ${isLast ? '' : 'border-b border-gray-50'}">
            <div class="flex items-start justify-between mb-3">
              <div>
                <p class="text-sm font-semibold text-gray-900">${c.product}</p>
                <p class="text-xs text-gray-400 mt-0.5">${c.business || ''} · ${formatDate(c.created_at)}</p>
              </div>
              <div class="text-right shrink-0 ml-4">
                ${statusBadge(c.status)}
              </div>
            </div>

            <!-- Views bar -->
            <div class="mb-2">
              <div class="flex items-center gap-3">
                <span class="text-xs text-gray-400 w-10 shrink-0">Views</span>
                <div class="flex-1 bg-gray-100 rounded-full h-2 overflow-hidden">
                  <div class="bg-orange-400 h-2 rounded-full transition-all duration-700"
                       style="width: ${viewsPct}%"></div>
                </div>
                <span class="text-xs font-medium text-gray-600 w-16 text-right shrink-0">
                  ${views.toLocaleString('en-IN')}
                </span>
              </div>
            </div>

            <!-- Clicks bar -->
            <div>
              <div class="flex items-center gap-3">
                <span class="text-xs text-gray-400 w-10 shrink-0">Clicks</span>
                <div class="flex-1 bg-gray-100 rounded-full h-2 overflow-hidden">
                  <div class="bg-blue-400 h-2 rounded-full transition-all duration-700"
                       style="width: ${clicksPct}%"></div>
                </div>
                <span class="text-xs font-medium text-gray-600 w-16 text-right shrink-0">
                  ${clicks.toLocaleString('en-IN')}
                </span>
              </div>
            </div>
          </div>`;
      });
    }

    loadAnalytics();
  </script>

</body>
</html>
