<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Create Campaign - DesiGrowth</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

  <!-- Main Card -->
  <div class="bg-white shadow-lg rounded-lg p-8 w-full max-w-lg">

    <h1 class="text-2xl font-bold text-blue-600 mb-6 text-center">
      Create Marketing Campaign
    </h1>

    <!-- Campaign Form -->
    <form id="campaignForm" class="space-y-4">

      <!-- Business Name -->
      <div>
        <label class="block text-sm font-medium mb-1">Business Name</label>
        <input
          id="business"
          type="text"
          placeholder="Sharma Grocery"
          class="w-full border rounded p-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
          required>
      </div>

      <!-- Product Name -->
      <div>
        <label class="block text-sm font-medium mb-1">Product Name</label>
        <input
          id="product"
          type="text"
          placeholder="Premium Rice"
          class="w-full border rounded p-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
          required>
      </div>

      <!-- Offer -->
      <div>
        <label class="block text-sm font-medium mb-1">Offer</label>
        <input
          id="offer"
          type="text"
          placeholder="20% OFF"
          class="w-full border rounded p-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
          required>
      </div>

      <!-- Festival -->
      <div>
        <label class="block text-sm font-medium mb-1">Festival</label>
        <input
          id="festival"
          type="text"
          placeholder="Diwali"
          class="w-full border rounded p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <!-- Location -->
      <div>
        <label class="block text-sm font-medium mb-1">Location</label>
        <input
          id="location"
          type="text"
          placeholder="Delhi"
          class="w-full border rounded p-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
          required>
      </div>

      <!-- Upload Image -->
      <div>
        <label class="block text-sm font-medium mb-1">Upload Product Image</label>
        <input
          id="image"
          type="file"
          class="w-full border rounded p-2">
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 transition">

        Generate Campaign

      </button>

    </form>

  </div>

  <!-- JS Script -->
  <script src="script.js"></script>

</body>

</html>
