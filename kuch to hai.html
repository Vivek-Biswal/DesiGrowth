<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Random Anime Image</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #0d0d1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
      color: #e0e0ff;
      padding: 24px;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 28px;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #c084fc, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .card {
      background: #1a1a2e;
      border: 1px solid #2e2e50;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 0 40px rgba(192, 132, 252, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      max-width: 480px;
      width: 100%;
    }

    .image-wrapper {
      width: 100%;
      aspect-ratio: 3 / 4;
      background: #12122a;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    #anime-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 12px;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    #anime-img.visible {
      opacity: 1;
    }

    .spinner {
      position: absolute;
      width: 44px;
      height: 44px;
      border: 4px solid #2e2e50;
      border-top-color: #c084fc;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    .spinner.active {
      display: block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    button {
      background: linear-gradient(135deg, #7c3aed, #db2777);
      color: #fff;
      border: none;
      padding: 12px 36px;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 4px 20px rgba(124, 58, 237, 0.4);
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 28px rgba(124, 58, 237, 0.6);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .error {
      color: #f87171;
      font-size: 0.875rem;
      display: none;
    }
  </style>
</head>
<body>

  <h1>✨ Anime Image</h1>

  <div class="card">
    <div class="image-wrapper">
      <div class="spinner" id="spinner"></div>
      <img id="anime-img" alt="Random anime image" />
    </div>
    <p class="error" id="error-msg">Failed to load image. Please try again.</p>
    <button id="next-btn" onclick="fetchImage()">Next Image</button>
  </div>

  <script>
    const img = document.getElementById('anime-img');
    const spinner = document.getElementById('spinner');
    const btn = document.getElementById('next-btn');
    const errorMsg = document.getElementById('error-msg');

    async function fetchImage() {
      btn.disabled = true;
      errorMsg.style.display = 'none';
      img.classList.remove('visible');
      spinner.classList.add('active');

      try {
        const res = await fetch('https://api.waifu.pics/sfw/waifu');
        if (!res.ok) throw new Error('API error');
        const data = await res.json();

        img.onload = () => {
          spinner.classList.remove('active');
          img.classList.add('visible');
          btn.disabled = false;
        };

        img.onerror = () => {
          spinner.classList.remove('active');
          errorMsg.style.display = 'block';
          btn.disabled = false;
        };

        img.src = data.url;
      } catch (e) {
        spinner.classList.remove('active');
        errorMsg.style.display = 'block';
        btn.disabled = false;
      }
    }

    fetchImage();
  </script>

</body>
</html>
